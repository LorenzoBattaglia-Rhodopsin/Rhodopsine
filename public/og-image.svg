<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Rhodopsine — La tua vista conta">
  <defs>
    <radialGradient id="iris" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#67ADA3" stop-opacity="0.95"/>
      <stop offset="55%" stop-color="#67ADA3" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#67ADA3" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#67ADA3" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#67ADA3" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Sfondo -->
  <rect width="1200" height="630" fill="#1A1816"/>

  <!-- Iride decorativa a destra -->
  <g transform="translate(910 315)">
    <circle r="300" fill="url(#glow)"/>
    <circle r="150" fill="none" stroke="#E6DFD3" stroke-opacity="0.12" stroke-width="1.5"/>
    <circle r="118" fill="none" stroke="#E6DFD3" stroke-opacity="0.16" stroke-width="1.5"/>
    <circle r="86" fill="url(#iris)"/>
    <circle r="30" fill="#1A1816"/>
    <circle r="30" fill="none" stroke="#E6DFD3" stroke-opacity="0.25" stroke-width="1.5"/>
    <circle cx="-14" cy="-14" r="7" fill="#E6DFD3" opacity="0.55"/>
  </g>

  <!-- Marchio -->
  <g transform="translate(90 150)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <text x="0" y="0" fill="#67ADA3" font-size="26" font-weight="600" letter-spacing="6">RHODOPSINE</text>
    <text x="0" y="120" fill="#E6DFD3" font-size="92" font-weight="600" letter-spacing="-2">La tua vista</text>
    <text x="0" y="220" fill="#E6DFD3" font-size="92" font-weight="600" letter-spacing="-2">conta.</text>
    <text x="0" y="300" fill="#A89F90" font-size="30" font-weight="400">Educazione e prevenzione per il benessere visivo digitale.</text>
  </g>
</svg>
